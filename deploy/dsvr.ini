; Dungeon Siege VR (dsvr) settings. Changes take effect the next time the game starts.

[HeadTracking]
; 1 = camera follows head position when the game starts, 0 = off (toggle in-game with the hotkey)
Enabled = 1
; Head movement multiplier: 6 means leaning 10 cm moves the game camera 60 cm
Scale = 6.0
; Closest the camera may get to the party (metres) when leaning in
MinEyeDistance = 1.5
; Hotkeys (Windows virtual-key codes), pressed together with Ctrl while the game window is focused
; 0x78 = F9, 0x79 = F10
ToggleKey = 0x78
RecenterKey = 0x79

[Stereo]
; 1 = true stereo VR (the world is drawn per eye and follows head rotation; HeadTracking Scale then
;     sets the world scale: 6 makes the world look 1/6 size, like a tabletop)
; 0 = flat curved screen (the [Screen] settings below)
Enabled = 0

[Screen]
; Virtual screen width and distance in front of the seated position (metres)
Width = 2.0
Distance = 2.5

[Interface]
; Stereo only: the game's 2D interface (panels, inventory, cursor) is drawn on its own frames and shown on a
; flat panel in front of you, instead of being drawn into each eye.
; Period: every Nth game frame draws the interface (7 = ~30 interface updates/s at 210 fps); 0 = off
Period = 7
; Panel width and distance in front of your eyes (metres). Clicks are aimed through the panel.
Width = 1.6
Distance = 1.5
; The panel stays put while you look around it, and glides over to your gaze once you look more than
; this many degrees away (so the cursor can reach anything you face). 0 = always straight ahead.
FollowAngle = 25

